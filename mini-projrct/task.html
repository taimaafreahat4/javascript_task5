<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TO DO LIST</title>


<style>

*{
    box-sizing:border-box;
}


body{

    background:linear-gradient(135deg,#667eea,#764ba2);

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    font-family:Arial;

}



.container{

    background:white;

    width:450px;

    padding:30px;

    border-radius:15px;

    box-shadow:0 10px 30px rgba(0,0,0,0.2);

}



h1{

    text-align:center;

    color:#333;

    margin-bottom:25px;

}



input{

    width:65%;

    padding:12px;

    border:2px solid #ddd;

    border-radius:8px;

    outline:none;

    font-size:16px;

}



input:focus{

    border-color:#667eea;

}



button{

    padding:10px 15px;

    background:#667eea;

    color:white;

    border:none;

    border-radius:8px;

    cursor:pointer;

    margin-left:5px;

}



button:hover{

    background:#764ba2;

}



#listTask{

    margin-top:25px;

}



#listTask p{

    background:#f5f5f5;

    padding:12px;

    border-radius:8px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:10px;

}



#listTask button{

    background:#ff4d4d;

    padding:7px 10px;

}


#listTask button:hover{

    background:#cc0000;

}
.clear{

    margin-top:20px;

    width:100%;

    background:#333;

}
</style>
</head>
<body>
<div class="container">
<h1>
TO-DO LIST
</h1>
<input 
type="text" 
id="inputText"
placeholder="Please enter task name">


<button id="addButton">
Add Task
</button>



<div id="listTask">

</div>



<button 
class="clear"
id="clearButton">

Clear All

</button>



</div>



<script src="task.js"></script>


</body>


</html>
